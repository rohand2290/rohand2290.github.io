<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%SITE_NAME% · Overcast Archipelago</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="theme-color" content="#224953" />
    <style>
      /* Static sky for the very first paint, before any CSS or JS loads. */
      html, body { margin: 0; background: #224953; color: #eee8d5; }
    </style>
  </head>
  <body>
    <div id="sky" aria-hidden="true"></div>
    <canvas id="world" aria-hidden="true"></canvas>
    <div id="mist" aria-hidden="true"></div>
    <div id="flash" aria-hidden="true"></div>
    <div id="fade" aria-hidden="true"></div>
    <svg id="bolt" aria-hidden="true" focusable="false"></svg>

    <div id="app">
      <a class="skip-link" href="resume/">Skip to plain resume</a>
      <header class="site-header">
        <div class="brand">
          <h1 class="site-name">%SITE_NAME%</h1>
          <p class="tagline">%SITE_TAGLINE%</p>
        </div>
        <div class="controls">
          <button type="button" class="btn" id="sound-toggle" aria-pressed="false">Sound: off</button>
          <button type="button" class="btn" id="weather-toggle">Weather: Storm</button>
          <button type="button" class="btn" id="skip-toggle" aria-pressed="false">Skip walking: off</button>
          <a class="btn btn-dark" href="resume.pdf" target="_blank" rel="noopener">Plain resume</a>
        </div>
      </header>

      <main id="main">
        <h2 class="visually-hidden">Islands</h2>
        <div id="labels"></div>

        <section id="note" class="note" role="region" aria-labelledby="note-title" hidden>
          <div class="note-head">
            <p class="eyebrow" id="note-eyebrow"></p>
            <button type="button" class="icon-btn" id="note-close" aria-label="Close note">×</button>
          </div>
          <h2 class="note-title" id="note-title" tabindex="-1"></h2>
          <p class="note-summary" id="note-summary"></p>
          <ul class="note-items" id="note-items" aria-label="Items on this island"></ul>
          <div class="note-actions" id="note-actions">
            <button type="button" class="btn btn-primary" id="note-read">Read note</button>
          </div>
        </section>

        <div id="panel-backdrop" hidden></div>
        <section id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden>
          <div class="panel-head">
            <p class="eyebrow" id="panel-eyebrow"></p>
            <button type="button" class="btn" id="panel-close">Close</button>
          </div>
          <h2 class="panel-title" id="panel-title" tabindex="-1"></h2>
          <div class="prose" id="panel-body"></div>
          <p class="panel-links" id="panel-links"></p>
        </section>
      </main>

      <nav class="island-nav" aria-label="Islands">
        <ul id="nav-list"></ul>
        <p class="hint"><span class="hint-keys">WASD or click to walk · Shift to run · Space to jump · E to read</span><span class="hint-touch">Tap to walk · tap a hint to read</span> · bridge width = how related two areas are</p>
      </nav>
      <p class="visually-hidden" id="announcer" aria-live="polite"></p>
    </div>

    <noscript>
      <p class="noscript">This world needs JavaScript. The <a href="resume/">plain resume</a> has everything.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
